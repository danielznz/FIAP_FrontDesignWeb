<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrossel 3D</title>

    <style>
        body {
            background-color: rgb(23, 73, 0);
            margin: 0;
            padding: 0;
        }

        .scene {
            margin: 80% auto;
            width: 210px;
            position: relative;
            aspect-ratio: 4/5;
            perspective: 1000px;
        }

        .carousel {
            position: absolute;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            animation: rotate 30s infinite linear;
        }

        .carousel img {
            position: absolute;
            top: 0;
            left: 0;
            width: 190px;
            aspect-ratio: 4/5;
            border-radius: 10px;
            transform: rotateY(var(--i)) translateZ(288px);
        }

        @keyframes rotate {
            0% {
                transform: rotateY(360deg);

            }

            100% {
                transform: rotateY(0deg);
            }
        }
    </style>

</head>

<body>
    <div class="scene">
        <div class="carousel">
            <img src="1.webp" alt="" style="--i: 000deg">
            <img src="2.webp" alt="" style="--i: 040deg">
            <img src="3.webp" alt="" style="--i: 080deg">
            <img src="4.webp" alt="" style="--i: 120deg">
            <img src="5.webp" alt="" style="--i: 160deg">
            <img src="6.webp" alt="" style="--i: 200deg">
            <img src="7.webp" alt="" style="--i: 240deg">
            <img src="8.webp" alt="" style="--i: 280deg">
            <img src="9.webp" alt="" style="--i: 320deg">
        </div>
    </div>
</body>

</html>
